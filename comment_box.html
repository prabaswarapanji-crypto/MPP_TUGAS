<!DOCTYPE html>
<html>
    <head>
        <title>Kotak Komentar</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                padding: 20px;
            }
            textarea {
                width: 100%;
                height: 100px;
                padding: 10px;
                margin-bottom: 10px;
                box-sizing: border-box;
            }
            button {
                padding: 10px 15px;
                background-color: #007bff;
                color: white;
                border: none;
                cursor: pointer;
            }
            .errorComment{
                color: red;
                font-weight: bold;
                margin-bottom: 10px;
            }
            .comment-item {
                border: 1px solid #ccc;
                padding: 10px;
                margin-top: 10px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .comment-item p {
                margin: 0;
                flex-grow: 1;
            }
            .delete-btn {
                background-color: #dc3545;
                padding: 5px 10px;
                margin-left: 10px;
            }
        </style>
    </head>
    <body>
         <h1>Kotak Komentar</h1>

        <textarea id="commentInput" placeholder="Tulis komentar Anda di sini..."></textarea>

        <p id="errorComment"></p>

        <button id="submitComment">Kirim Komentar</button>

        <h2>Daftar Komentar</h2>

        <div id="commentList"></div>

        <script src="comment_script.js"></script>
    </body>
</html>
